<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Interact Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky azure bar, role switcher, tab row, then one working view per role. Boldness lives in the member progress ring. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface2:#F5F7FC; --ink:#0E1A33; --muted:#5A6684; --line:#D9DFEC;
  --brand:#14428C; --brand-ink:#FFFFFF; --brand-soft:#E2EAF9; --link:#14428C;
  --gold:#F2A900; --gold-soft:#FFF2CC; --gold-ink:#6B4800;
  --good:#17825B; --good-soft:#DDF3EA; --warn:#B26A00; --warn-soft:#FFEFD1; --bad:#C23A3A; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(14,26,51,.06),0 6px 20px rgba(14,26,51,.06);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-script:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#111B30; --surface2:#16223B; --ink:#E9EEF8; --muted:#9AA7C4; --line:#24324F;
  --brand:#0E2F66; --brand-ink:#FFFFFF; --brand-soft:#1A2C52; --link:#8DB0FF;
  --gold:#F5B52A; --gold-soft:#3A2D0A; --gold-ink:#F7D88A;
  --good:#46C492; --good-soft:#12362A; --warn:#F0B050; --warn-soft:#3B2C10; --bad:#F08484; --bad-soft:#40191B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111B30; --surface2:#16223B; --ink:#E9EEF8; --muted:#9AA7C4; --line:#24324F;
  --brand:#0E2F66; --brand-ink:#FFFFFF; --brand-soft:#1A2C52; --link:#8DB0FF;
  --gold:#F5B52A; --gold-soft:#3A2D0A; --gold-ink:#F7D88A;
  --good:#46C492; --good-soft:#12362A; --warn:#F0B050; --warn-soft:#3B2C10; --bad:#F08484; --bad-soft:#40191B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700} h3{font-size:16px;font-weight:700} h4{font-size:13px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3b2700;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;display:block;line-height:1.1}
.brand span{font-size:11px;opacity:.8}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:3px;border-radius:10px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:var(--brand-ink);padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px}
.roles button[aria-pressed="true"]{background:var(--gold);color:#3b2700;font-weight:700}
.roles select{background:rgba(255,255,255,.18);color:var(--brand-ink);border:0;border-radius:8px;padding:6px 8px}
.roles select option{color:#0E1A33}

.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#3b2700;font-size:11px;font-weight:700;margin-left:6px;padding:0 5px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.flat{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.gold{background:var(--gold);color:#3b2700;border-color:var(--gold)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--link);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
label.ck{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13px}
label.ck input{width:auto}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar.gold>i{background:var(--gold)}
.bar.good>i{background:var(--good)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:460px;overflow-y:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{position:sticky;top:0;background:var(--surface2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
.tile b{font-family:var(--f-display);font-size:30px;font-weight:800;display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* member home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.levels div{border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;font-size:11px;background:var(--surface2);min-width:0}
.levels div b{display:block;font-family:var(--f-display);font-size:13px}
.levels div.on{background:var(--gold);border-color:var(--gold);color:#3b2700}
.levels div.done{background:var(--brand-soft);color:var(--link)}
.badge{display:flex;gap:10px;align-items:center}
.badge .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface2);border:1px solid var(--line);filter:grayscale(1);opacity:.7;flex:none}
.badge.on .ic{filter:none;opacity:1;background:var(--gold-soft);border-color:var(--gold)}
.pie{width:112px;height:112px;flex:none}

/* events */
.ev h3{font-size:16px}
.ev .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.ev .meta dt{color:var(--muted)} .ev .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:var(--surface2)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days i{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:var(--surface2)}
.days i.ok{background:var(--good);border-color:var(--good)} .days i.pd{background:var(--gold);border-color:var(--gold)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:700}
.filters button[aria-pressed="true"]{border-color:var(--brand);color:var(--link);background:var(--brand-soft)}

/* feed + photos */
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--surface2)}
.linkbox{aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);display:grid;place-content:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tile-photo{position:relative}
.tile-photo .who{position:absolute;left:6px;top:6px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,26,.6);display:grid;place-items:end center;z-index:50;padding:0}
@media(min-width:640px){.scrim{place-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet.wide{max-width:900px}
.admsel{min-width:120px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)} .steps i.done{background:var(--brand)}
.cam{aspect-ratio:4/3;border-radius:12px;background:#0b1220;color:#9db3dd;display:grid;place-content:center;text-align:center;padding:16px;position:relative;font-size:12px}
.cam::before,.cam::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
.cam::before{left:12px;top:12px;border-right:0;border-bottom:0}
.cam::after{right:12px;bottom:12px;border-left:0;border-top:0}
.cam b{color:#fff;font-size:14px}
.qrwrap{display:grid;place-items:center;gap:10px}
.qrbox{background:#fff;padding:12px;border-radius:12px;width:min(100%,280px);aspect-ratio:1}
.qrbox svg{width:100%;height:100%;display:block}
.code{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:.18em}
.toastbox{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;z-index:80;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;max-width:520px;box-shadow:var(--shadow)}

/* certificate */
.cert{background:#FFFDF6;color:#14213D;border:2px solid #14428C;outline:6px double #F2A900;outline-offset:-14px;border-radius:6px;padding:34px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert h2{font-size:clamp(22px,5vw,32px);color:#14428C}
.cert .big{font-family:var(--f-display);font-size:clamp(26px,6vw,40px);font-weight:800}
.cert .sigs{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.cert .sig{font-family:var(--f-script);font-size:28px;border-bottom:1px solid #14213D;padding:0 18px;min-width:150px}
.cert .sl{font-size:11px;color:#4a5878;margin-top:2px}
.cert ul{margin:0;padding:0;list-style:none;font-size:13px}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
/* auth screen */
input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{width:100%;max-width:400px}
.authcard .brand b{color:var(--ink)}
.err{color:var(--bad);font-size:12px;font-weight:700;min-height:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modal"></div>
<div class="toastbox"><div id="toast" class="toast" hidden></div></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SECT=['Creative','Events','Finance','Community'];
const LV=['Novice Interactor','Active Change Maker','Community Leader','Rotary Ambassador'];
const LVMIN=[0,10,25,50];
const lvl=h=>h<10?0:h<25?1:h<50?2:3;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const fmt=ts=>new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const VLABEL={gps:'GPS 200 m',qr:'Live QR',selfie:'Live photo',link:'Work link'};

function photo(seed,label,ts){
  const c=document.createElement('canvas');c.width=320;c.height=240;const x=c.getContext('2d');const r=mul(seed);const h=Math.floor(r()*360);
  const g=x.createLinearGradient(0,0,0,240);g.addColorStop(0,`hsl(${h},45%,72%)`);g.addColorStop(1,`hsl(${(h+40)%360},40%,36%)`);
  x.fillStyle=g;x.fillRect(0,0,320,240);
  for(let i=0;i<5;i++){x.fillStyle=`hsla(${(h+i*30)%360},40%,${25+r()*30}%,.55)`;x.beginPath();x.arc(r()*320,120+r()*110,30+r()*60,0,7);x.fill()}
  for(let i=0;i<4;i++){const px=50+i*70+r()*18;x.fillStyle='rgba(16,28,52,.55)';x.beginPath();x.arc(px,128,16,0,7);x.fill();x.fillRect(px-21,146,42,58)}
  x.fillStyle='rgba(8,16,32,.82)';x.fillRect(0,204,320,36);x.font='bold 11px monospace';x.fillStyle='#fff';x.fillText('LIVE CAPTURE  '+fmt(ts),10,219);x.fillStyle='#F2A900';x.fillText(label.slice(0,42),10,234);
  return c.toDataURL('image/jpeg',.6);
}

/* ---------- sample data ---------- */
let M,E,L,S,CI=null,lid=0;
function init(){
  const rnd=mul(2026);
  const FN=['Nomin','Temuulen','Anujin','Bat-Erdene','Ariunaa','Tuguldur','Enkhjin','Munkh-Orgil','Khulan','Tselmeg','Dorjsuren','Narantsetseg','Orgil','Misheel','Zolboo','Amar','Bayarmaa','Chinguun','Delger','Erdene','Gerel','Ichinkhorloo','Jargal','Naran','Odgerel','Sukhbat','Uyanga','Yesui','Tamir','Altan'];
  const IN='BGDESTMNOU'.split('');
  const nm=i=>FN[i%30]+' '+IN[(i*7+Math.floor(i/30)*3+3)%10]+'.';
  M=[];
  for(let i=0;i<60;i++){
    const lead=i>=1&&i<=4;
    M.push({id:'m'+i,name:i===0?'Nomin B.':nm(i),st:lead?'lead':'active',sec:i===0?'Creative':lead?SECT[i-1]:SECT[Math.floor(rnd()*4)],
      in:i===0?12:Math.round((4+rnd()*17)*2)/2,out:i===0?6:Math.round((2+rnd()*12)*2)/2,req:false});
  }
  for(let i=0;i<10;i++)M.push({id:'v'+i,name:i===0?'Saruul T.':nm(60+i),st:'keep',sec:SECT[Math.floor(rnd()*4)],in:0,out:0,req:false});
  const sh=['Tarot reading','Photobooth','Scavenger desk'],sh2=['Shagai games','Tarot reading','Photobooth'];
  E=[
   {id:'e1',t:'Halloween Scavenger Hunt & Fashion Walk',sec:'Events',h:3,cap:15,loc:'Main Auditorium',date:'Oct 31',type:'in',v:['gps','qr','selfie'],shifts:sh,setup:true,vol:3,active:false},
   {id:'e2',t:'Tsagaan Sar Booth Rotation',sec:'Events',h:2.5,cap:12,loc:'School gym',date:'Feb 2027',type:'in',v:['gps','qr','selfie'],shifts:sh2,setup:true,vol:2,active:false},
   {id:'e3',t:'Club Fair Booth',sec:'Events',h:2,cap:8,loc:'School lobby',date:'Sep 24',type:'in',v:['gps','qr','selfie'],setup:true,vol:0,active:false},
   {id:'e4',t:'Pepero Day Order Run',sec:'Finance',h:1.5,cap:10,loc:'Finance room 204',date:'Nov 11',type:'in',v:['gps','qr','selfie'],orders:{placed:42,delivered:31},vol:2,active:false},
   {id:'e5',t:'Tsergiin Bayr Video Edit',sec:'Creative',h:4,cap:6,loc:'Off-site task',date:'Mar 2027',type:'in',v:['link'],vol:0,active:false},
   {id:'e6',t:"Women's Day Graphics Set",sec:'Creative',h:3,cap:6,loc:'Off-site task',date:'Due Oct 20',type:'in',v:['link'],vol:0,active:true},
   {id:'e7',t:'2-Week Tree Planting',sec:'Community',h:1,cap:20,loc:'Songino Khairkhan planting site',date:'Oct 5 to Oct 18',type:'out',v:['gps','qr','selfie'],days:14,vol:4,active:true},
   {id:'e8',t:'City Cleanup',sec:'Community',h:2,cap:25,loc:'Peace Avenue, Sukhbaatar Sq. side',date:'Oct 10',type:'out',v:['gps','qr','selfie'],vol:5,active:true},
   {id:'e9',t:'Khoroo Aid Delivery',sec:'Community',h:2.5,cap:12,loc:'Three drop-off zones',date:'Oct 24',type:'out',v:['gps','qr','selfie'],points:['Khoroo office (pickup)','Zone A drop-off','Zone B drop-off'],vol:3,active:false},
   {id:'e10',t:'TYK Distribution',sec:'Community',h:2,cap:14,loc:'Two distribution points',date:'Nov 3',type:'out',v:['gps','qr','selfie'],points:['Warehouse pickup','Distribution point'],vol:3,active:false},
   {id:'e11',t:'Animal Shelter Visit',sec:'Community',h:2,cap:10,loc:'City animal shelter',date:'Nov 7',type:'out',v:['gps','qr','selfie'],waiver:true,vol:2,active:false},
   {id:'e12',t:'Orphanage Visit',sec:'Community',h:2.5,cap:10,loc:'Children\'s home',date:'Nov 21',type:'out',v:['gps','qr','selfie'],waiver:true,vol:2,active:false}
  ];
  const act=M.filter(m=>m.st!=='keep'&&m.id!=='m0');
  E.forEach(e=>{e.signups=[];e.vsign=[];const n=Math.min(e.cap-1,Math.round(e.cap*(.35+rnd()*.5)));
    for(let k=0;k<n;k++){const m=act[Math.floor(rnd()*act.length)];if(!e.signups.find(s=>s.m===m.id))e.signups.push({m:m.id,shift:e.shifts?e.shifts[k%3]:null})}
    e.vsign=M.filter(m=>m.st==='keep'&&m.id!=='v0').slice(0,Math.floor(rnd()*3)).map(m=>m.id)});
  ['e1','e7','e8','e6'].forEach(id=>{const e=E.find(x=>x.id===id);e.signups.push({m:'m0',shift:e.shifts?e.shifts[0]:null})});
  L=[];
  const add=(mid,eid,status,ago,x)=>{const e=E.find(q=>q.id===eid),ts=Date.now()-ago*3600e3;L.push(Object.assign({id:'l'+(++lid),mid,eid,h:e.h,status,ts,ph:e.v.includes('selfie')?photo(lid*97+3,e.t,ts):null,link:null,ot:null,fl:false,cheer:[],cm:[]},x||{}))};
  [1,2,3].forEach(d=>add('m0','e7','approved',24*(4-d)+6,{day:d}));
  add('m5','e7','pending',3,{day:2});add('m6','e7','pending',5,{day:1});add('m7','e7','pending',2,{day:3,ot:{hrs:1,reason:'Stayed to water the new seedlings after the crew left.',status:'pending'}});
  add('m8','e6','pending',9,{link:'canva.com/design/women-day-poster-set'});add('m9','e6','pending',20,{link:'drive.google.com/file/womens-day-banner'});
  add('m10','e3','pending',30);add('m11','e3','pending',31);
  add('m12','e4','pending',12);
  add('m20','e8','approved',50,{});add('m21','e8','approved',50,{});
  S={role:'member',lead:'Community',tab:{member:'home',lead:'review',pres:'center',vol:'events'},filter:'all',q:'',certM:'m0',exSec:'all',exSt:'all',waived:{},pend:null};
}
init();

/* ---------- derived ---------- */
const P=id=>M.find(m=>m.id===id), EV=id=>E.find(e=>e.id===id);
function hrs(mid){const m=P(mid);let i=m.in,o=m.out,pen=0;
  L.filter(l=>l.mid===mid).forEach(l=>{const e=EV(l.eid);const ot=l.ot&&l.ot.status==='approved'?l.ot.hrs:0;
    if(l.status==='approved'){if(e.type==='in')i+=l.h+ot;else o+=l.h+ot}else if(l.status==='pending')pen+=l.h});
  return{i,o,t:i+o,pen}}
function secTotals(){const t={Creative:0,Events:0,Finance:0,Community:0};
  M.filter(m=>m.st!=='keep').forEach(m=>t[m.sec]+=m.in+m.out);
  L.filter(l=>l.status==='approved').forEach(l=>t[EV(l.eid).sec]+=l.h+(l.ot&&l.ot.status==='approved'?l.ot.hrs:0));return t}
function badges(mid){const al=L.filter(l=>l.mid===mid&&l.status==='approved');const b=mid==='m0'?{media:7,ops:2,trips:1,streak:3}:{media:0,ops:0,trips:0,streak:0};
  const media=b.media+al.filter(l=>EV(l.eid).sec==='Creative').reduce((a,l)=>a+l.h,0);
  const ops=b.ops+new Set(al.filter(l=>EV(l.eid).setup).map(l=>l.eid)).size;
  const trips=b.trips+new Set(al.filter(l=>EV(l.eid).type==='out').map(l=>l.eid)).size;
  return[{k:'Media Guru',ic:'🎨',v:media,n:10,d:'10+ hours in design, media or promo content'},
    {k:'Operations Master',ic:'⚙️',v:ops,n:3,d:'3+ setups or teardowns for major school events'},
    {k:'Community Hero',ic:'🤝',v:trips,n:3,d:'3+ out-of-school service trips'},
    {k:'Streak Master',ic:'🔥',v:b.streak,n:3,d:'Attended 3 consecutive official initiatives'}]}
const pending=sec=>L.filter(l=>l.status==='pending'&&(!sec||EV(l.eid).sec===sec));
const flagged=()=>L.filter(l=>l.fl);
const otReq=()=>L.filter(l=>l.ot&&l.ot.status==='pending');
const leadOf=sec=>M.find(m=>m.st==='lead'&&m.sec===sec);
const mySign=(e,mid)=>e.signups.find(s=>s.m===mid);
const code=(eid,w)=>{let h=2166136261;for(const c of eid+':'+w){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return String((h>>>0)%1000000).padStart(6,'0')};
const win=()=>Math.floor(Date.now()/30000);

function qrSvg(c){const n=25,r=mul(parseInt(c,10)||1);let d='';
  const fin=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(fin(x,y))continue;if(r()>.5)d+=`M${x},${y}h1v1h-1z`}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0b1220"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0b1220"/>`;
  return`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Check-in QR code (visual sample)"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#0b1220"/>${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`}

function evCard(e,mode){
  const mid=mode==='vol'?'v0':'m0';
  const s=mode==='vol'?null:mySign(e,mid);
  const mine=L.filter(l=>l.mid===mid&&l.eid===e.id);
  const full=e.signups.length>=e.cap;
  const vOpen=e.vol-e.vsign.length;
  let act='';
  if(mode==='member'){
    const slots=e.days||1,used=mine.filter(l=>l.status!=='rejected').length;
    if(!s)act=`<button class="btn pri" data-act="signup" data-id="${e.id}" ${full?'disabled':''}>${full?'Full':'Sign up'}</button>`;
    else if(used>=slots)act=`<span class="pill good">All logged</span>`;
    else act=`<button class="btn gold" data-act="ci" data-id="${e.id}">${e.days?`Check in, day ${used+1}`:'Scan check-in'}</button><button class="btn sm" data-act="unsign" data-id="${e.id}">Leave</button>`;
  }else if(mode==='vol'){
    const joined=e.vsign.includes('v0');
    act=joined?`<span class="pill good">Standby slot booked</span><button class="btn sm" data-act="vleave" data-id="${e.id}">Cancel</button>`:`<button class="btn pri" data-act="vsign" data-id="${e.id}" ${vOpen<=0?'disabled':''}>${vOpen>0?'Take a volunteer slot':'No open slots'}</button>`;
  }
  const dots=e.days?`<div class="days" aria-label="Daily check-ins">${Array.from({length:e.days},(_,i)=>{const l=mine.find(x=>x.day===i+1);return`<i class="${l?(l.status==='approved'?'ok':'pd'):''}"></i>`}).join('')}</div>`:'';
  const names=e.signups.slice(0,8).map(x=>P(x.m).name).join(', ')+(e.signups.length>8?` and ${e.signups.length-8} more`:'');
  return`<article class="card ev stack">
    <div class="row between" style="align-items:flex-start"><h3>${esc(e.t)}</h3><span class="pill gold mono">${f1(e.h)} h${e.days?' / day':''}</span></div>
    <div class="chips"><span class="pill">${e.sec}</span><span class="chip">${e.type==='in'?'In-school':'Out-of-school'}</span>${e.v.map(v=>`<span class="chip">${VLABEL[v]}</span>`).join('')}${e.waiver?'<span class="chip">Waiver required</span>':''}${e.active?'<span class="pill good">Active now</span>':''}</div>
    <dl class="meta" style="margin:0"><dt>When</dt><dd>${e.date}</dd><dt>Where</dt><dd>${esc(e.loc)}</dd>
      <dt>Roster</dt><dd>${e.signups.length} of ${e.cap} members${mode==='vol'?`, ${vOpen} volunteer slots open`:''}</dd>
      ${e.points?`<dt>Zones</dt><dd>${e.points.map(esc).join(' · ')}</dd>`:''}
      ${s&&s.shift?`<dt>Your booth</dt><dd><b>${s.shift}</b></dd>`:''}
      ${e.orders?`<dt>Orders</dt><dd>${e.orders.placed} placed, ${e.orders.delivered} delivered</dd>`:''}</dl>
    <div class="bar"><i style="width:${Math.min(100,e.signups.length/e.cap*100)}%"></i></div>
    ${dots}
    ${mode==='vol'?`<details><summary class="small muted" style="cursor:pointer">Public roster</summary><p class="small" style="margin-top:6px">${esc(names)||'No sign-ups yet'}</p></details>`:''}
    ${mine.length&&mode==='member'&&!e.days?`<p class="small muted">Your log: ${mine.map(l=>l.status).join(', ')}</p>`:''}
    <div class="row">${act}</div></article>`}

    <p class="small muted">Goes to the ${e.sec} Sector Lead for approval. Hours cannot be typed in by members.</p>`}
  const last=CI.i===st.length-1;

/* ---------- accounts (talks to the Express backend) ---------- */
async function api(path,method='GET',body){
  const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(data.error||'Request failed'),{status:r.status});
  return data}

/* Co-Presidents can preview every view; everyone else is locked to their own */
const roleChoices=()=>isPres()?ROLES:ROLES.filter(([k])=>k===ROLE_MAP[S.user.role]);

/* Point the sample data at the real account until events/logs move to the API */
function applyUser(u){
  S.user=u;S.role=ROLE_MAP[u.role]||'vol';if(u.sector)S.lead=u.sector;
  P('m0').name=u.name;P('v0').name=u.name}

function authView(mode,msg){
  const reg=mode==='register';
  $('#app').innerHTML=`<div class="authwrap"><form class="card stack authcard" id="authForm" data-mode="${mode}" novalidate>
    <div class="brand"><div class="mark">IC</div><div><b>Interact Club Hub</b><span class="muted">${reg?'Create your account':'Log in to continue'}</span></div></div>
    ${reg?`<label>Full name<input type="text" name="name" autocomplete="name" maxlength="80"></label>`:''}
    <label>Email<input type="email" name="email" autocomplete="email"></label>
    <label>Password<input type="password" name="password" autocomplete="${reg?'new-password':'current-password'}"></label>
    ${reg?'<p class="small muted">At least 8 characters. New accounts start as Volunteers; the Co-Presidents promote you to Member.</p>':''}
    <div class="err" id="authErr" role="alert">${esc(msg||'')}</div>
    <button class="btn pri" type="submit">${reg?'Create account':'Log in'}</button>
    <button class="btn" type="button" data-act="authswitch" data-m="${reg?'login':'register'}">${reg?'I already have an account':'Create an account'}</button>
  </form></div>`;
  const first=$('#authForm input');if(first)first.focus()}

document.addEventListener('submit',async e=>{
  const f=e.target.closest('#authForm');if(!f)return;e.preventDefault();
  const btn=f.querySelector('[type=submit]'),err=$('#authErr');btn.disabled=true;err.textContent='';
  try{const {user}=await api('/api/auth/'+f.dataset.mode,'POST',Object.fromEntries(new FormData(f)));
    applyUser(user);render();toast('Welcome, '+user.name)}
  catch(x){err.textContent=x.message;btn.disabled=false}});

/* ---------- admin: user role management ---------- */
const ADM={users:[],q:''};
const ADM_ROLES=[['volunteer','Volunteer'],['member','Member'],['lead','Sector Lead'],['pres','Co-President'],['admin','Admin']];
const roleLabel=r=>(ADM_ROLES.find(x=>x[0]===r)||[r,r])[1];

function admRowHtml(u){
  const me=u.id===S.user.id;
  return `<tr data-uid="${u.id}" data-s="${esc((u.name+' '+u.email).toLowerCase())}">
   <td><b>${esc(u.name)}</b>${me?' <span class="pill">you</span>':''}</td>
   <td class="small">${esc(u.email)}</td>
   <td><span class="pill ${u.role==='admin'?'gold':u.role==='volunteer'?'':'good'}">${esc(roleLabel(u.role))}</span></td>
   <td><select class="admsel" aria-label="New role for ${esc(u.name)}" data-ch="admrole" ${me?'disabled title="You cannot change your own role"':''}>
     ${ADM_ROLES.map(([k,n])=>`<option value="${k}" ${k===u.role?'selected':''}>${n}</option>`).join('')}</select></td>
   <td><select class="admsel" aria-label="Sector for ${esc(u.name)}" ${u.role==='lead'&&!me?'':'disabled'}>
     <option value="">None</option>${SECT.map(s=>`<option ${s===u.sector?'selected':''}>${s}</option>`).join('')}</select></td>
   <td><button class="btn sm pri" data-act="admsave" data-id="${u.id}" ${me?'disabled':''}>Save</button></td></tr>`}

function admDraw(){
  modal(`<div class="row" style="justify-content:space-between"><b style="font-size:17px">Admin: user roles</b><button class="btn sm" data-act="cic">Close</button></div>
   <input type="search" placeholder="Search by name or email" aria-label="Search users" data-in="admq" value="${esc(ADM.q)}">
   <div class="small muted" id="admCount"></div>
   <div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Current role</th><th>New role</th><th>Sector</th><th></th></tr></thead>
    <tbody id="admRows">${ADM.users.map(admRowHtml).join('')}</tbody></table></div>
   <div id="admNone" class="empty" hidden>No users match your search.</div>
   <p class="small muted">Sector is only used for Sector Leads. You cannot change your own role.</p>`,true);
  admFilter()}

/* Hide rows instead of rebuilding them, so unsaved dropdown choices survive while searching. */
function admFilter(){
  const q=ADM.q.trim().toLowerCase();let n=0;
  document.querySelectorAll('#admRows tr').forEach(tr=>{const hit=!q||tr.dataset.s.includes(q);tr.hidden=!hit;if(hit)n++});
  const c=$('#admCount');if(c)c.textContent=n+' of '+ADM.users.length+' users';
  const none=$('#admNone');if(none)none.hidden=n>0}

async function boot(){
  try{const {user}=await api('/api/auth/me');if(user){applyUser(user);render()}else authView('login')}
  catch(e){authView('login',e.status?'Server error ('+e.status+'). Please try again.':'Cannot reach the server. Is it running?')}}
boot();
</script>

</body></html>
